# pyproject.toml — loopsheet
# Digital-twin data models for industrial machines. Kovir Labs · Apache-2.0.
#
# Toolchain (see CLAUDE.md §4): uv + ruff + mypy + pytest.
#   uv sync                 # env + core + dev group
#   uv run loopsheet ...    # CLI
#   uv run pytest -q

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# --------------------------------------------------------------------------- #
# Project metadata                                                            #
# --------------------------------------------------------------------------- #
[project]
name = "loopsheet"
version = "0.1.0a0"                       # pre-alpha (PEP 440 for "0.1.0-alpha")
description = "Digital-twin data models for industrial machines — sensors, IO-Link masters, PLCs, and their MQTT / OPC UA / EtherNet-IP configuration."
readme = "README.md"
# 3.11, not the house 3.14 default: this package has an external audience and
# most industrial Python in the field is 3.11/3.12 (PLAN.md §1).
requires-python = ">=3.11"
license = "Apache-2.0"                    # SPDX expression (PEP 639)
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Evan Gress", email = "evan@kovirlabs.dev" }]
keywords = [
    "io-link", "iodd", "industrial", "automation", "digital-twin",
    "opc-ua", "mqtt", "ethernet-ip", "plc", "scada", "iiot", "condition-monitoring",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
]

# Core is pydantic + pyyaml and NOTHING else (CLAUDE.md — core purity).
# Every wire protocol lives behind an extra and is lazy-imported from adapters/.
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mqtt    = ["paho-mqtt>=2.1"]              # EPL-2.0 OR BSD-3-Clause
async   = ["aiomqtt>=2.4"]                # async wrapper over paho
opcua   = ["asyncua>=1.1"]                # LGPL-3.0 — optional ON PURPOSE
enip    = ["pycomm3>=1.2"]                # MIT; generic CIP explicit messaging
iotcore = ["httpx>=0.27"]                 # ifm IoT Core REST / JSON-RPC
modbus  = ["pymodbus>=3.7"]               # BSD-3-Clause
units   = ["pint>=0.24", "pydantic-pint>=0.5"]
aas     = ["basyx-python-sdk>=2.0"]

[project.urls]
Homepage = "https://kovirlabs.dev"
Repository = "https://github.com/evangress/loopsheet"
Issues = "https://github.com/evangress/loopsheet/issues"

# TODO(loopsheet): re-enable once cli.py exists (TODO.md Phase 7).
# [project.scripts]
# loopsheet = "loopsheet.cli:main"

# Third parties ship vendor catalog packs by advertising this group. The value
# is an importable package holding one YAML file per part number; the file name
# IS the part number, so `catalog.list_parts()` enumerates without parsing YAML
# or running vendor code. The built-in ifm pack registers here too, so the
# third-party path is the one that is actually exercised.
[project.entry-points."loopsheet.catalog"]
ifm = "loopsheet.catalog.data.ifm"

# --------------------------------------------------------------------------- #
# Dev tooling (uv-native group; installed by `uv sync` by default)            #
# --------------------------------------------------------------------------- #
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
]

# --------------------------------------------------------------------------- #
# Packaging — src layout                                                      #
# --------------------------------------------------------------------------- #
# Catalog YAML under src/loopsheet/catalog/data/ is package data and rides along
# inside the package dir; it is read through importlib.resources, never via
# __file__-relative paths.
[tool.hatch.build.targets.wheel]
packages = ["src/loopsheet"]

[tool.hatch.build.targets.sdist]
include = ["src/loopsheet", "tests", "examples", "README.md", "LICENSE", "NOTICE"]

# --------------------------------------------------------------------------- #
# Ruff — lint + format                                                        #
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
# Ruff will reformat Python fenced blocks inside Markdown. PLAN.md, TODO.md and
# the research notes are prose whose code blocks are illustrative and
# deliberately aligned; leave them alone.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort (one canonical import order, no hand-sorting)
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # flake8-simplify
    "C4",       # comprehensions
    "RUF",      # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["loopsheet"]

[tool.ruff.lint.per-file-ignores]
# Tests assert on exact byte patterns and magic bit offsets; that is the point.
"tests/*" = ["E501"]

# --------------------------------------------------------------------------- #
# Mypy — strict, no exceptions for our own code                               #
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
pretty = true
plugins = ["pydantic.mypy"]

# Optional protocol libs ship partial or no stubs. Ignore *their* missing types
# without loosening strictness on ours. These are only ever imported from
# adapters/, never from core.
[[tool.mypy.overrides]]
module = ["paho.*", "asyncua.*", "pycomm3.*", "pymodbus.*", "basyx.*", "pint.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
# Pytest + coverage                                                           #
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["loopsheet"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
